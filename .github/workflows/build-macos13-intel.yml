name: Build Windows and macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-servers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-setup
        with:
          target: x86_64-unknown-linux-musl
          source-sha: ${{ github.sha }}
      # Build Linux servers once for the macOS and Windows packages.
      - name: Compile Linux remote servers
        timeout-minutes: 35
        shell: bash
        run: |
          rustup target add aarch64-unknown-linux-musl
          mkdir -p target/remote-server
          for arch in x86_64 aarch64; do
            target="$arch-unknown-linux-musl"
            linker="CARGO_TARGET_$(echo "$target" | tr '[:lower:]-' '[:upper:]_')_LINKER"
            env "$linker=rust-lld" cargo build --release --locked -p winc-server --target "$target"
            cp "target/$target/release/winc-server" "target/remote-server/winc-server-Linux-$arch"
          done
          file target/remote-server/*
      - uses: actions/upload-artifact@v7
        with:
          name: build-remote-servers
          path: target/remote-server/winc-server-Linux-*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS 13 (${{ matrix.arch }})
    needs: remote-servers
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary-arch: x86_64
          - arch: arm64
            os: macos-26
            target: aarch64-apple-darwin
            binary-arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      TARGET: ${{ matrix.target }}
      BINARY_ARCH: ${{ matrix.binary-arch }}
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-setup
        with:
          target: ${{ matrix.target }}
          source-sha: ${{ github.sha }}
      - name: Check formatting
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check
      - name: Test commit message editing
        run: cargo test --locked -p winc-app rebase
      - name: Compile application
        run: cargo build --release --locked --target "$TARGET" -p winc -p winc-pty
      - uses: actions/download-artifact@v8
        with:
          name: build-remote-servers
          path: target/remote-server
      - name: Verify remote server artifacts
        run: |
          test -s target/remote-server/winc-server-Linux-x86_64
          test -s target/remote-server/winc-server-Linux-aarch64
          chmod +x target/remote-server/winc-server-Linux-*
          file target/remote-server/*
      - name: Package application and DMG
        run: |
          bash release/macos/package.sh app "$TARGET"
          app="target/$TARGET/release/bundle/macos/winc.app"
          /usr/libexec/PlistBuddy -c 'Set :LSMinimumSystemVersion 13.0' "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
          bash release/macos/package.sh dmg "$TARGET"
      - name: Verify architecture and minimum OS of bundled Mach-O files
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          app = pathlib.Path('target') / os.environ['TARGET'] / 'release/bundle/macos/winc.app'
          count = 0
          for path in app.rglob('*'):
              if not path.is_file() or path.is_symlink():
                  continue
              kind = subprocess.check_output(['file', '-b', str(path)], text=True)
              if 'Mach-O' not in kind:
                  continue
              subprocess.run(['lipo', str(path), '-verify_arch', os.environ['BINARY_ARCH']], check=True)
              headers = subprocess.check_output(['otool', '-arch', os.environ['BINARY_ARCH'], '-l', str(path)], text=True)
              versions = re.findall(r'^\s*minos\s+(\d+(?:\.\d+)*)\s*$', headers, re.M)
              versions += re.findall(r'cmd LC_VERSION_MIN_MACOSX\s+cmdsize \d+\s+version (\d+(?:\.\d+)*)', headers)
              assert versions, f'No minimum OS found: {path}'
              for version in versions:
                  parts = tuple(map(int, version.split('.')))
                  assert (parts + (0, 0))[:2] <= (13, 0), f'{path} requires macOS {version}'
              count += 1
          assert count >= 2, 'Missing application binaries'
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: Winc-macos13-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0


  windows:
    name: Windows x86_64
    needs: remote-servers
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
      CARGO_INCREMENTAL: 0
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-setup
        with:
          target: ${{ env.TARGET }}
          source-sha: ${{ github.sha }}
      - name: Test commit message editing
        run: cargo test --locked -p winc-app rebase
      - name: Compile application and icons
        run: |
          cargo build --release --locked --target "$TARGET" -p winc -p winc-pty
          cargo xtask icons "target/$TARGET/release/bundle/icons"
      - uses: actions/download-artifact@v8
        with:
          name: build-remote-servers
          path: target/remote-server
      - name: Compile WSL file watcher
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl -p winc-watch
      - name: Fetch console host
        shell: pwsh
        run: ./release/windows/conpty.ps1 -Destination "target/$env:TARGET/release"
      - name: Install native packaging tools
        shell: pwsh
        run: |
          choco install nsis --version=3.11 --allow-downgrade --yes --no-progress
          choco install wixtoolset --version=3.14.1 --allow-downgrade --yes --no-progress
      # Manual builds are unsigned downloads and do not publish an update feed.
      - name: Configure unsigned packages
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { version, msiVersion } from './release/common/config.mjs';
          const current = version();
          writeFileSync(`${process.env.RUNNER_TEMP}/build-config.json`, JSON.stringify({
            version: current, msiVersion: msiVersion(current),
          }));
          JS
      - name: Package installers and portable archive
        shell: pwsh
        run: |
          ./release/windows/package.ps1 -Phase installers -Target $env:TARGET
          ./release/windows/package.ps1 -Phase portable -Target $env:TARGET
      - uses: actions/upload-artifact@v7
        with:
          name: Winc-windows-x86_64
          path: |
            target/${{ env.TARGET }}/release/bundle/nsis/*-setup.exe
            target/${{ env.TARGET }}/release/bundle/msi/*.msi
            target/${{ env.TARGET }}/release/bundle/portable/*.zip
          if-no-files-found: error
          compression-level: 0
